<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krushi ERP</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2e6b3a">
<style>
:root{--bg:#f4f1e8;--card:#fff;--tx:#23301f;--mut:#667262;--pri:#2e6b3a;--on:#fff;--pri2:#e8f0e2;--acc:#b8862b;--bad:#b3402e;--bd:#dcd6c3}
@media(prefers-color-scheme:dark){:root{--bg:#171c15;--card:#1f261c;--tx:#e8eadf;--mut:#9aa595;--pri:#6fae79;--on:#10200f;--pri2:#26331f;--acc:#d3a24a;--bad:#e2806f;--bd:#33402e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Noto Sans","Noto Sans Devanagari","Nirmala UI",Mangal,sans-serif;padding-bottom:76px}
.hd{background:#2e6b3a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;background-image:linear-gradient(135deg,#2e6b3a,#3f8049)}
.hd b{font-size:18px}.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--pri2);border-radius:12px;padding:12px;border-left:5px solid var(--pri)}
.stat small{color:var(--mut);display:block}.stat b{font-size:21px}
.stat.w{border-color:var(--acc)}.stat.d{border-color:var(--bad)}
h3{margin:4px 0 10px;font-size:17px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.it{padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.mut{color:var(--mut);font-size:14px}.bad{color:var(--bad);font-weight:600}.ok{color:var(--pri);font-weight:600}
button{font:inherit;border:0;border-radius:9px;padding:9px 14px;background:var(--pri);color:var(--on);cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.sm{padding:5px 10px;font-size:14px}
input,select{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);margin:3px 0 8px}
label{display:block;font-size:14px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:9px 2px;font-size:12px}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:700}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}.bars div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
.bl{display:flex;gap:6px;margin-top:4px}.bl small{flex:1;text-align:center;color:var(--mut);font-size:11px}
</style></head><body>
<div class="hd"><b id="ttl">🌾 Krushi ERP</b><span class="pill" id="pill"></span></div>
<main id="v"></main>
<nav id="nav"></nav>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>parseFloat(x)||0, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const money=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const L={en:{dash:'Home',bill:'Bill',stock:'Stock',cust:'Farmers',set:'Settings',today:"Today's sales",due:'Total udhari',low:'Low stock',exp:'Expiring (60d)',week:'Last 7 days',top:'Highest dues',add:'+ Add',collect:'Collect',remind:'SMS',save:'Save',thanks:'Thank you'},
mr:{dash:'मुख्य',bill:'बिल',stock:'साठा',cust:'शेतकरी',set:'सेटिंग',today:'आजची विक्री',due:'एकूण उधारी',low:'कमी साठा',exp:'मुदत संपणार (६०दि)',week:'गेले ७ दिवस',top:'सर्वाधिक थकबाकी',add:'+ नवीन',collect:'वसुली',remind:'एसएमएस',save:'जतन करा',thanks:'धन्यवाद'},
hi:{dash:'होम',bill:'बिल',stock:'स्टॉक',cust:'किसान',set:'सेटिंग',today:'आज की बिक्री',due:'कुल उधारी',low:'कम स्टॉक',exp:'एक्सपायरी (60दिन)',week:'पिछले 7 दिन',top:'सबसे ज़्यादा बकाया',add:'+ जोड़ें',collect:'वसूली',remind:'SMS',save:'सेव',thanks:'धन्यवाद'}};
const t=k=>(L[S.settings.lang]||L.en)[k]||L.en[k]||k;
const DEF={settings:{shop:'My Krushi Kendra',lang:'en',autoSms:'no',smsUrl:'',smsMethod:'GET',smsBody:'',smsHeaders:'',clientId:'',file:'krushi-erp-data.json',last:0},
products:[],customers:[],sales:[],payments:[],outbox:[],seq:1,dirty:false};
let S=JSON.parse(JSON.stringify(DEF)),tab='dash',cart={cid:'',items:[],paid:''};

/* ---------- storage: IndexedDB (fallback localStorage) ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('krushi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){try{return JSON.parse(localStorage.getItem('krushi'))}catch(_){return null}}}
async function persist(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'db')}catch(e){try{localStorage.setItem('krushi',JSON.stringify(S))}catch(_){}}}
let st;function save(){S.dirty=true;persist();pill();clearTimeout(st);st=setTimeout(()=>sync(false),4000)}

/* ---------- business helpers ---------- */
const bal=id=>S.sales.filter(s=>s.cid===id).reduce((a,s)=>a+s.total-s.paid,0)-S.payments.filter(p=>p.cid===id).reduce((a,p)=>a+p.amt,0);
const cname=id=>(S.customers.find(c=>c.id===id)||{name:'Walk-in'}).name;
const lineTot=i=>i.qty*i.rate*(1+i.gst/100);
function vasooli(){return{v:1,updated:new Date().toISOString(),shop:S.settings.shop,
customers:S.customers.map(c=>({id:c.id,name:c.name,village:c.village,phone:c.phone,balance:Math.round(bal(c.id)*100)/100})),
ledger:[...S.sales.filter(s=>s.cid).map(s=>({id:s.id,date:s.date,cid:s.cid,type:'sale',amount:s.total,paid:s.paid})),
...S.payments.map(p=>({id:p.id,date:p.date,cid:p.cid,type:'payment',amount:p.amt,paid:p.amt}))]}}

/* ---------- SMS (queued when offline) ---------- */
async function smsNow(o){const s=S.settings;if(!s.smsUrl)throw new Error('SMS API not set');
const j=x=>JSON.stringify(x).slice(1,-1);const f=(a)=>a.replace(/\{to\}/g,encodeURIComponent(o.to)).replace(/\{msg\}/g,encodeURIComponent(o.msg));
const init={method:s.smsMethod};let h={};try{h=s.smsHeaders?JSON.parse(s.smsHeaders):{}}catch(e){throw new Error('Headers must be JSON')}
if(s.smsMethod==='POST'){init.body=s.smsBody.replace(/\{to\}/g,j(o.to)).replace(/\{msg\}/g,j(o.msg));h['Content-Type']=h['Content-Type']||'application/json; charset=UTF-8'}
init.headers=h;const r=await fetch(f(s.smsUrl),init);if(!r.ok)throw new Error('SMS HTTP '+r.status)}
async function sms(to,msg){if(!to)return alert('No mobile number');S.outbox.push({id:uid(),to,msg});save();await flush()}
async function flush(){if(!navigator.onLine||!S.settings.smsUrl)return;for(const o of [...S.outbox]){try{await smsNow(o);S.outbox=S.outbox.filter(x=>x.id!==o.id);save()}catch(e){console.warn(e);break}}pill()}

/* ---------- Google Drive sync ---------- */
let tok=null,texp=0;
const gis=()=>new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('Cannot load Google script'));document.head.appendChild(s)});
const auth=ia=>new Promise((res,rej)=>{google.accounts.oauth2.initTokenClient({client_id:S.settings.clientId,scope:'https://www.googleapis.com/auth/drive.file',
callback:r=>{if(r.access_token){tok=r.access_token;texp=Date.now()+(r.expires_in-60)*1000;res()}else rej(new Error(r.error||'auth'))},error_callback:e=>rej(new Error(e.type||'auth'))}).requestAccessToken({prompt:ia?'consent':''})});
async function findId(name){const q=encodeURIComponent("name='"+name.replace(/'/g,"\\'")+"' and trashed=false");const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)',{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw new Error('Drive '+r.status);const j=await r.json();return j.files&&j.files[0]&&j.files[0].id}
async function upsert(name,obj){const id=await findId(name),b='kr'+Date.now();
const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,mimeType:'application/json'})+'\r\n--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(obj)+'\r\n--'+b+'--';
const r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart',{method:id?'PATCH':'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+b},body});
if(!r.ok)throw new Error('Drive upload '+r.status)}
let busy=false;
async function sync(ia){if(busy||!navigator.onLine||!S.settings.clientId||(!ia&&!S.dirty))return;busy=true;pill('Syncing…');
try{await gis();if(Date.now()>texp)await auth(ia);S.dirty=false;S.settings.last=Date.now();await upsert(S.settings.file||'krushi-erp-data.json',S);await upsert('vasooli-sync.json',vasooli());persist();if(ia)alert('✓ Synced to Google Drive')}
catch(e){S.dirty=true;if(ia)alert('Sync failed: '+e.message)}busy=false;pill()}
async function restore(){if(!S.settings.clientId||!navigator.onLine)return alert('Need internet + Client ID');if(!confirm('Replace local data with Drive backup?'))return;
try{await gis();if(Date.now()>texp)await auth(true);const id=await findId(S.settings.file);if(!id)return alert('Backup not found');const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:{Authorization:'Bearer '+tok}});const d=await r.json();S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);S.settings=Object.assign({},DEF.settings,d.settings);persist();go(tab)}catch(e){alert('Restore failed: '+e.message)}}

/* ---------- UI helpers ---------- */
function pill(m){const n=S.outbox.length;$('#pill').textContent=m||((navigator.onLine?'● Online':'○ Offline')+(S.dirty?' · sync pending':' · saved')+(n?' · SMS '+n:''))}
function modal(title,fields,ok){const d=document.createElement('dialog');
d.innerHTML='<form><h3>'+esc(title)+'</h3>'+fields.map(f=>'<label>'+esc(f.l)+(f.o?'<select name="'+f.k+'">'+f.o.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]==f.v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':'<input name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(f.v)+'"'+(f.t=='number'?' step="any" inputmode="decimal"':'')+'>')+'</label>').join('')+'<div class="row"><button type="button" class="ghost" id="x">✕</button><button>'+t('save')+'</button></div></form>';
document.body.appendChild(d);d.querySelector('#x').onclick=()=>d.close();d.onclose=()=>d.remove();
d.querySelector('form').onsubmit=e=>{e.preventDefault();ok(Object.fromEntries(new FormData(e.target)));d.close()};d.showModal()}
const TABS=[['dash','🏠'],['bill','🧾'],['stock','📦'],['cust','👨‍🌾'],['set','⚙️']];
function go(k){tab=k;$('#ttl').textContent='🌾 '+S.settings.shop;$('#nav').innerHTML=TABS.map(x=>'<button class="'+(x[0]==k?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+t(x[0])+'</button>').join('');$('#v').innerHTML=V[k]();pill()}

/* ---------- views ---------- */
const V={
dash(){const td=ymd(),sum=a=>a.reduce((x,y)=>x+y,0);
const today=sum(S.sales.filter(s=>s.date===td).map(s=>s.total)),due=sum(S.customers.map(c=>Math.max(0,bal(c.id))));
const low=S.products.filter(p=>p.stock<=p.min).length,lim=ymd(new Date(Date.now()+60*864e5)),ex=S.products.filter(p=>p.exp&&p.exp<=lim).length;
const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return[d.getDate(),sum(S.sales.filter(s=>s.date===ymd(d)).map(s=>s.total))]}),mx=Math.max(1,...days.map(d=>d[1]));
const tops=S.customers.map(c=>[c,bal(c.id)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
return '<div class="grid"><div class="stat"><small>'+t('today')+'</small><b>'+money(today)+'</b></div><div class="stat d"><small>'+t('due')+'</small><b>'+money(due)+'</b></div><div class="stat w"><small>'+t('low')+'</small><b>'+low+'</b></div><div class="stat w"><small>'+t('exp')+'</small><b>'+ex+'</b></div></div><br>'+
'<div class="card"><h3>'+t('week')+'</h3><div class="bars">'+days.map(d=>'<div style="height:'+Math.round(d[1]/mx*100)+'%" title="'+d[1]+'"></div>').join('')+'</div><div class="bl">'+days.map(d=>'<small>'+d[0]+'</small>').join('')+'</div></div>'+
'<div class="card"><h3>'+t('top')+'</h3>'+(tops.map(x=>'<div class="it row"><span>'+esc(x[0].name)+' <span class="mut">'+esc(x[0].village)+'</span></span><span class="bad">'+money(x[1])+'</span></div>').join('')||'<div class="mut">—</div>')+'</div>'},
bill(){const tot=sum2(cart.items.map(lineTot));
return '<div class="card"><h3>🧾 '+t('bill')+'</h3><label>'+t('cust')+'<select onchange="cart.cid=this.value;go(\'bill\')"><option value="">Walk-in</option>'+S.customers.map(c=>'<option value="'+c.id+'"'+(c.id==cart.cid?' selected':'')+'>'+esc(c.name)+' ('+esc(c.village)+')</option>').join('')+'</select></label>'+
'<div class="row"><select id="bp" style="flex:3">'+S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+p.stock+p.unit+'</option>').join('')+'</select><input id="bq" type="number" value="1" step="any" style="flex:1"></div><button class="ghost" onclick="addLine()">'+t('add')+'</button></div>'+
'<div class="card">'+(cart.items.map((i,n)=>'<div class="it row"><span>'+esc(i.name)+'<br><span class="mut">'+i.qty+' × '+i.rate+' +'+i.gst+'%</span></span><span>'+money(lineTot(i))+' <button class="sm ghost" onclick="cart.items.splice('+n+',1);go(\'bill\')">✕</button></span></div>').join('')||'<div class="mut">—</div>')+
'<h3 class="row"><span>Total</span><span>'+money(tot)+'</span></h3><label>Paid ₹<input id="bpaid" type="number" step="any" inputmode="decimal" value="'+esc(cart.paid)+'" placeholder="'+Math.round(tot)+'" onchange="cart.paid=this.value"></label><button onclick="saveBill()">'+t('save')+'</button></div>'},
stock(){return '<button onclick="prodForm()">'+t('add')+'</button><br><br><div class="card">'+(S.products.map(p=>'<div class="it row"><span><b>'+esc(p.name)+'</b> <span class="mut">'+esc(p.cat)+(p.batch?' · '+esc(p.batch):'')+(p.exp?' · exp '+esc(p.exp):'')+'</span><br>'+money(p.price)+'/'+esc(p.unit)+' · GST '+p.gst+'%</span><span class="'+(p.stock<=p.min?'bad':'ok')+'">'+p.stock+' '+esc(p.unit)+'<br><button class="sm ghost" onclick="prodForm(\''+p.id+'\')">✎</button></span></div>').join('')||'<div class="mut">—</div>')+'</div>'},
cust(){return '<button onclick="custForm()">'+t('add')+'</button><br><br><div class="card">'+(S.customers.map(c=>{const b=bal(c.id);return '<div class="it"><div class="row"><span><b>'+esc(c.name)+'</b> <span class="mut">'+esc(c.village)+' · '+esc(c.phone)+'</span></span><span class="'+(b>0?'bad':'ok')+'">'+money(b)+'</span></div><button class="sm" onclick="collect(\''+c.id+'\')">'+t('collect')+'</button> <button class="sm ghost" onclick="remind(\''+c.id+'\')">'+t('remind')+'</button> <button class="sm ghost" onclick="custForm(\''+c.id+'\')">✎</button></div>'}).join('')||'<div class="mut">—</div>')+'</div>'},
set(){const s=S.settings,F=(k,l,ph)=>'<label>'+l+'<input data-k="'+k+'" value="'+esc(s[k])+'" placeholder="'+(ph||'')+'" onchange="S.settings[this.dataset.k]=this.value;save()"></label>';
return '<div class="card"><h3>⚙️ Shop</h3>'+F('shop','Shop name')+'<label>Language<select onchange="S.settings.lang=this.value;save();go(\'set\')">'+[['en','English'],['mr','मराठी'],['hi','हिन्दी']].map(o=>'<option value="'+o[0]+'"'+(s.lang==o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label></div>'+
'<div class="card"><h3>☁️ Google Drive</h3>'+F('clientId','OAuth Client ID','xxxx.apps.googleusercontent.com')+F('file','Backup file name')+'<div class="mut">Last sync: '+(s.last?new Date(s.last).toLocaleString():'never')+'</div><br><button onclick="sync(true)">Sync now</button> <button class="ghost" onclick="restore()">Restore</button></div>'+
'<div class="card"><h3>✉️ SMS API</h3>'+F('smsUrl','URL ({to} {msg})','https://…?to={to}&text={msg}')+'<label>Method<select onchange="S.settings.smsMethod=this.value;save()"><option'+(s.smsMethod=='GET'?' selected':'')+'>GET</option><option'+(s.smsMethod=='POST'?' selected':'')+'>POST</option></select></label>'+F('smsBody','POST body (JSON)','{"to":"{to}","message":"{msg}"}')+F('smsHeaders','Headers (JSON)','{"Authorization":"KEY"}')+'<label>Auto SMS on credit bill / collection<select onchange="S.settings.autoSms=this.value;save()"><option value="no"'+(s.autoSms=='no'?' selected':'')+'>No</option><option value="yes"'+(s.autoSms=='yes'?' selected':'')+'>Yes</option></select></label><div class="mut">Outbox: '+S.outbox.length+'</div><br><button class="ghost" onclick="flush()">Send pending</button></div>'+
'<div class="card"><h3>💾 Backup</h3><button class="ghost" onclick="exp()">Export file</button> <button class="ghost" onclick="$(\'#imp\').click()">Import file</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div>'}};
const sum2=a=>a.reduce((x,y)=>x+y,0);

/* ---------- actions ---------- */
function addLine(){const p=S.products.find(x=>x.id===$('#bp').value),q=num($('#bq').value);if(!p||q<=0)return;if(q>p.stock&&!confirm('Stock only '+p.stock+'. Continue?'))return;cart.paid=$('#bpaid').value;cart.items.push({pid:p.id,name:p.name,qty:q,rate:p.price,gst:p.gst});go('bill')}
function saveBill(){if(!cart.items.length)return;const total=Math.round(sum2(cart.items.map(lineTot))*100)/100,paid=$('#bpaid').value===''?total:num($('#bpaid').value);
if(paid<total&&!cart.cid)return alert('Select a farmer for credit (udhari) bill');
const s={id:uid(),no:S.seq++,date:ymd(),cid:cart.cid,items:cart.items,total,paid:Math.min(paid,total)};
s.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid);if(p)p.stock=Math.round((p.stock-i.qty)*1000)/1000});S.sales.push(s);
const c=S.customers.find(x=>x.id===s.cid);cart={cid:'',items:[],paid:''};save();
if(c&&s.total>s.paid&&S.settings.autoSms==='yes')sms(c.phone,S.settings.shop+': Bill #'+s.no+' '+money(s.total)+', paid '+money(s.paid)+', due '+money(bal(c.id))+'. '+t('thanks'));
alert('Bill #'+s.no+' saved');go('dash')}
function prodForm(id){const p=S.products.find(x=>x.id===id)||{id:uid(),name:'',cat:'Seeds',unit:'kg',price:0,gst:0,stock:0,min:5,batch:'',exp:''};
modal('Product',[{k:'name',l:'Name',v:p.name},{k:'cat',l:'Category',v:p.cat,o:['Seeds','Fertilizer','Pesticide','Tools','Other'].map(x=>[x,x])},{k:'unit',l:'Unit',v:p.unit},{k:'price',l:'Rate (excl. GST)',t:'number',v:p.price},{k:'gst',l:'GST %',t:'number',v:p.gst},{k:'stock',l:'Stock',t:'number',v:p.stock},{k:'min',l:'Low-stock alert',t:'number',v:p.min},{k:'batch',l:'Batch / Lot',v:p.batch},{k:'exp',l:'Expiry',t:'date',v:p.exp}],o=>{
if(!o.name.trim())return;Object.assign(p,o,{price:num(o.price),gst:num(o.gst),stock:num(o.stock),min:num(o.min)});if(!S.products.includes(p))S.products.push(p);save();go('stock')})}
function custForm(id){const c=S.customers.find(x=>x.id===id)||{id:uid(),name:'',village:'',phone:'',limit:0};
modal('Farmer',[{k:'name',l:'Name',v:c.name},{k:'village',l:'Village',v:c.village},{k:'phone',l:'Mobile',t:'tel',v:c.phone},{k:'limit',l:'Credit limit',t:'number',v:c.limit}],o=>{
if(!o.name.trim())return;Object.assign(c,o,{limit:num(o.limit)});if(!S.customers.includes(c))S.customers.push(c);save();go('cust')})}
function collect(id){const c=S.customers.find(x=>x.id===id);modal('Collect – '+c.name,[{k:'amt',l:'Amount ₹',t:'number',v:''},{k:'note',l:'Note',v:''}],o=>{
const a=num(o.amt);if(a<=0)return;S.payments.push({id:uid(),date:ymd(),cid:id,amt:a,note:o.note});save();
if(S.settings.autoSms==='yes')sms(c.phone,S.settings.shop+': received '+money(a)+'. Balance '+money(bal(id))+'. '+t('thanks'));go('cust')})}
function remind(id){const c=S.customers.find(x=>x.id===id);sms(c.phone,S.settings.shop+': '+c.name+', your pending balance is '+money(bal(id))+'. '+t('thanks'))}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='krushi-backup-'+ymd()+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);S.settings=Object.assign({},DEF.settings,d.settings);save();go('set')}catch(e){alert('Invalid file')}};r.readAsText(f,'UTF-8')}
